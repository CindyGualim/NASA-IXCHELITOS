# Render (plan gratuito) duerme el backend tras 15 min sin tráfico y tarda en despertar.
# Este ping cada 10 minutos lo mantiene despierto.
name: Keep Render awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -m 120 -o /dev/null -w "%{http_code}\n" https://nasa-ixchelitos.onrender.com/modelos/metricas || true
